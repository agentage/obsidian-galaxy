name: Release

# Two ways in:
#  1. Push a bare version tag (e.g. `0.1.1`) - the classic release. Obsidian requires
#     tag == manifest.json version; `.npmrc` sets `tag-version-prefix=` so `npm version`
#     emits bare tags, and `git push --follow-tags` fires this workflow.
#  2. workflow_dispatch - builds + releases the CURRENT manifest.json version (creating
#     the matching tag), with an optional `draft` to verify assets before publishing.
#
# Release the standard way (see RELEASING.md):
#   npm version patch   # bumps package.json + manifest.json + versions.json, makes a tag
#   git push --follow-tags
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create the GitHub Release as a draft (verify assets before publishing).'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write # provenance attestation (OIDC)
  attestations: write

jobs:
  release:
    name: 📦 Build & publish plugin release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches manifest version
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Release tag '$TAG' does not match manifest.json version '$MANIFEST'. Obsidian requires they be identical." >&2
            exit 1
          fi
          echo "tag and manifest agree on $TAG"

      - name: Verify (type-check + lint + format + test + build)
        run: npm run verify

      - name: Attest build provenance of release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Build release body from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"

          # Extract this version's section from CHANGELOG.md (written by the
          # release-prepare workflow). Empty extraction -> GitHub-generated notes
          # take over via generate_release_notes below.
          SECTION=$(awk -v ver="$TAG" '
            $0 ~ "^## \\[" ver "\\]" { grab=1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md 2>/dev/null || true)
          SECTION=$(printf '%s' "$SECTION" | sed -e 's/[[:space:]]*$//')

          {
            echo "**Agentage Galaxy ${TAG}** - see your Obsidian vault as a 3D, rotating force-graph."
            echo ""
            if [ -n "$SECTION" ]; then
              echo "$SECTION"
              echo ""
            fi
            echo "### Install (manual)"
            echo "Download \`main.js\`, \`manifest.json\`, and \`styles.css\` below into"
            echo "\`<your-vault>/.obsidian/plugins/agentage-galaxy/\`, then enable"
            echo "**Agentage Galaxy** under Settings -> Community plugins."
            echo ""
            echo "### Install (BRAT)"
            echo "Add \`agentage/obsidian-galaxy\` in the BRAT plugin."
            echo ""
            echo "See the [README](https://github.com/${{ github.repository }}#readme) for details."
          } > release-body.md

          if [ -n "$SECTION" ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
            echo "Using CHANGELOG.md section for $TAG."
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
            echo "No CHANGELOG.md section for $TAG - falling back to GitHub-generated notes."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          generate_release_notes: ${{ steps.notes.outputs.have_notes != 'true' }}
          body_path: release-body.md
          files: |
            main.js
            manifest.json
            styles.css
          fail_on_unmatched_files: true
