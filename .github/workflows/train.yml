name: Prepare Release

# v2-lite direct-to-master release train: wait for the org dependabot triage
# (.github-private) to finish merging this week's bumps, bump the version from
# conventional commits since the last tag, commit straight to master (no
# release/* branch, no PR), tag, and dispatch release.yml. No human step on the
# happy path.
#  - schedule: every Friday 19:00 UTC (L0 slot of the estate train; the whole train
#    runs on UTC - GitHub crons fire late by up to 1-2h, so a late run just departs
#    late instead of being hour-gated away). Dependabot opens its weekly PRs at
#    16:00 UTC and org triage merges them from 17:00 - this workflow never merges
#    dependabot PRs itself.
#  - workflow_dispatch: pick a bump_type (auto/patch/minor/major). `auto_merge` is
#    kept for input-schema compatibility with the old release-PR train but is now
#    a no-op - there's no PR to gate, every run pushes directly.
#
# 2026-08-22 migration off the release-PR pattern: branch -> PR -> auto-merge ->
# approve/poll broke 3 different ways in 3 weeks across the estate. This train now
# pushes the release commit straight to master and fails closed instead - a push
# failure is red (never forced), and the dispatched release.yml run is watched to
# conclusion with the published GitHub release asserted before the job is green.
on:
  schedule:
    - cron: '13 4 * * 6'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump (auto = infer from conventional commits)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      auto_merge:
        description: 'Unused since the v2-lite direct-to-master migration (kept for input compatibility)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  dependabot-quiescence:
    name: 🤖 Wait for dependabot triage to finish
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Wait until this repo has no fresh open dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Dependabot merging is owned by the org triage automation
          # (.github-private dependabot-triage.yml -> claude-triage-executor):
          # it starts at the dependabot window (16:00 UTC) and merges/fixes
          # PRs with judgment. This job only delays the train while that agent
          # may still be working, so this week's bumps ride this week's release.
          # PRs still open after the wait were deliberately left by triage
          # (breaking/suspicious) - the train departs without them.
          for i in $(seq 1 45); do
            OPEN=$(gh pr list -R "$REPO" --author "app/dependabot" --state open --json number --jq 'length')
            [ "$OPEN" = "0" ] && { echo "No open dependabot PRs - proceeding."; exit 0; }
            echo "poll $i: $OPEN open dependabot PR(s), waiting for triage..."
            sleep 60
          done
          echo "Dependabot PR(s) still open after wait - triage left them; releasing without them." | tee -a "$GITHUB_STEP_SUMMARY"

  prepare-release:
    name: 🚝 Release direct to master
    needs: [dependabot-quiescence]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect releasable commits + bump type
        id: detect
        run: |
          set -euo pipefail
          # Highest semver tag, NOT `git describe`: historical tags were made on
          # side branches and are not ancestors of master, which makes describe
          # return a stale tag.
          LAST_TAG=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            RANGE=""
            echo "No tag found, considering full history."
          else
            RANGE="${LAST_TAG}..HEAD"
            echo "Last tag: $LAST_TAG"
          fi

          SUBJECTS=$(git log $RANGE --no-merges --pretty=%s)
          BODIES=$(git log $RANGE --no-merges --pretty=%B)

          # Releasable = any commit whose type is NOT docs/chore/ci, PLUS dependency
          # bumps (chore(deps*): dependabot merges ship in the bundle, so they release
          # as a patch). chore(release) stays excluded. Bare-version subjects (legacy
          # manual release commits like `0.2.0 (#28)`) do not count.
          if [ -n "$SUBJECTS" ]; then
            NON_CHORE=$(printf '%s\n' "$SUBJECTS" \
              | grep -vE '^(docs|chore|ci)(\([^)]*\))?!?:' \
              | grep -vcE '^[0-9]+\.[0-9]+\.[0-9]+' || true)
            DEPS=$(printf '%s\n' "$SUBJECTS" | grep -cE '^chore\(deps' || true)
            RELEASABLE=$((NON_CHORE + DEPS))
          else
            RELEASABLE=0
          fi

          if [ "$RELEASABLE" -eq 0 ]; then
            echo "No releasable commits since ${LAST_TAG:-repo start} (only docs/ci/non-deps chore). Nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Found $RELEASABLE releasable commit(s)."

          INPUT_BUMP="${{ github.event.inputs.bump_type }}"
          BUMP="${INPUT_BUMP:-auto}"
          if [ "$BUMP" = "auto" ]; then
            if printf '%s\n' "$SUBJECTS" | grep -qE '^[a-z]+(\([^)]*\))?!:' \
              || printf '%s\n' "$BODIES" | grep -qE 'BREAKING[ -]CHANGE'; then
              BUMP=major
            elif printf '%s\n' "$SUBJECTS" | grep -qE '^feat(\([^)]*\))?:'; then
              BUMP=minor
            else
              BUMP=patch
            fi
          fi
          echo "Bump type: $BUMP"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"

      - name: Verify (type-check + lint + format + test + build)
        if: steps.detect.outputs.release == 'true'
        run: npm run verify

      - name: Bump version (no tag)
        id: bump
        if: steps.detect.outputs.release == 'true'
        run: |
          set -euo pipefail
          # --no-git-tag-version: skip commit + tag; the `version` script still runs
          # version-bump.mjs (updates manifest.json + versions.json).
          npm version --no-git-tag-version "${{ steps.detect.outputs.bump }}"
          npm install --package-lock-only
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate release notes with Claude
        if: steps.detect.outputs.release == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Claude-written notes; the script hard-falls-back to a mechanical
          # conventional-commit grouping if the key is missing or the API fails.
          node scripts/generate-changelog.mjs "${{ steps.bump.outputs.version }}" > release-notes.md
          echo "Generated release notes:"
          cat release-notes.md

      - name: Update CHANGELOG.md
        if: steps.detect.outputs.release == 'true'
        run: node scripts/update-changelog.mjs "${{ steps.bump.outputs.version }}" < release-notes.md

      - name: Commit + push release directly to master
        id: push
        if: steps.detect.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          rm -f release-notes.md

          git add -A
          git commit -m "chore(release): ${VERSION}"

          # Rebase onto whatever landed on master since checkout, then push
          # directly - no branch, no PR, no merge. A push failure is red, never
          # forced.
          git pull --rebase origin master
          git push origin HEAD:master

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag release
        if: steps.push.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.push.outputs.version }}"
          git tag "${VERSION}"
          git push origin "${VERSION}"

      - name: Dispatch release workflow
        if: steps.push.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.push.outputs.version }}"
          # A GITHUB_TOKEN tag push never fires release.yml's tag trigger, so
          # dispatch it explicitly (workflow_dispatch reads the already-pushed
          # tag/manifest version - see release.yml's "Resolve release version").
          gh workflow run release.yml --ref master --repo "${{ github.repository }}"
          echo "Tagged ${VERSION} and dispatched release.yml." >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for release.yml + verify published release
        if: steps.push.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.push.outputs.version }}"
          DISPATCH_EPOCH=$(date -u +%s)

          # gh workflow run doesn't return a run id, so poll gh run list for the
          # release.yml run that appeared after our dispatch.
          RUN_ID=""
          for i in $(seq 1 18); do
            sleep 10
            RUN_ID=$(gh run list --repo "$REPO" --workflow=release.yml --branch master \
              --json databaseId,createdAt --jq \
              "[.[] | select((.createdAt | fromdateiso8601) >= ($DISPATCH_EPOCH - 15))] | .[0].databaseId // empty")
            [ -n "$RUN_ID" ] && break
            echo "poll $i: dispatched release.yml run not visible yet..."
          done
          [ -n "$RUN_ID" ] || { echo "::error::Could not find the dispatched release.yml run."; exit 1; }

          echo "Watching release.yml run $RUN_ID to conclusion..."
          gh run watch "$RUN_ID" --repo "$REPO" --exit-status

          echo "Verifying GitHub release ${VERSION} was published with the expected assets..."
          RELEASE_JSON=$(gh release view "$VERSION" --repo "$REPO" --json tagName,assets)
          TAG=$(echo "$RELEASE_JSON" | jq -r '.tagName')
          [ "$TAG" = "$VERSION" ] || { echo "::error::Release tag '$TAG' does not match expected '$VERSION'"; exit 1; }
          for ASSET in main.js manifest.json styles.css; do
            echo "$RELEASE_JSON" | jq -e --arg a "$ASSET" '.assets[] | select(.name == $a)' >/dev/null \
              || { echo "::error::Release ${VERSION} is missing asset $ASSET"; exit 1; }
          done
          echo "Release ${VERSION} published with expected assets (main.js, manifest.json, styles.css)." >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.detect.outputs.release }}" != "true" ]; then
            echo "## Skipped - no releasable commits since the last tag" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ steps.push.outputs.version }}" ]; then
            echo "## Released direct to master" >> "$GITHUB_STEP_SUMMARY"
            echo "Version: ${{ steps.push.outputs.version }} (bump: ${{ steps.detect.outputs.bump }})" >> "$GITHUB_STEP_SUMMARY"
          fi
