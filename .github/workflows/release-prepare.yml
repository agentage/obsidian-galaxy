name: Prepare Release

# The fully automated Friday release train: wait for the org dependabot triage
# (.github-private) to finish merging this week's bumps, open the release PR from
# conventional commits since the last tag, merge it, tag, and dispatch release.yml.
# No human step on the happy path.
#  - schedule: every Friday 20:00 Europe/Prague. GitHub cron is UTC-only and Prague
#    shifts CEST/CET, so BOTH UTC slots are scheduled (18:00 UTC = 20:00 CEST summer,
#    19:00 UTC = 20:00 CET winter) and a gate job runs the rest only when the local
#    Prague hour is actually 20 (the wrong-DST run exits 0 silently). Dependabot opens
#    its weekly PRs at 18:00 Prague, two hours earlier; the org triage agent merges
#    them - this workflow never merges dependabot PRs itself.
#  - workflow_dispatch: pick a bump_type (auto/patch/minor/major) + optional auto_merge
#    (bypasses the hour gate).
#
# GITHUB_TOKEN caveats this workflow works around: its branch pushes don't fire
# pr-validation on the release PR (the in-workflow `npm run verify` here plus the one
# in release.yml are the CI gates), and its merges don't fire auto-tag-on-merge.yml -
# so after merging, this workflow tags and dispatches release.yml itself (auto-tag
# stays as the path for manually merged release PRs; both skip existing tags).
on:
  schedule:
    - cron: '0 18 * * 5'
    - cron: '0 19 * * 5'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump (auto = infer from conventional commits)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      auto_merge:
        description: 'Auto-merge the release PR after CI passes'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  prague-gate:
    name: 🕗 Friday 20:00 Prague gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - name: Check local Prague hour (DST-proof)
        id: gate
        run: |
          # Both UTC crons (18:00 + 19:00 Fri) target Friday 20:00 Europe/Prague;
          # only the slot where the local hour is actually 20 proceeds, the other
          # exits 0 silently. workflow_dispatch bypasses the gate.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "workflow_dispatch - bypassing hour gate."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(TZ=Europe/Prague date +%H)
          if [ "$HOUR" = "20" ]; then
            echo "Prague hour is 20 - proceeding."
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Prague hour is $HOUR, not 20 - wrong DST cron slot, skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  dependabot-quiescence:
    name: 🤖 Wait for dependabot triage to finish
    needs: prague-gate
    if: needs.prague-gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Wait until this repo has no fresh open dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Dependabot merging is owned by the org triage automation
          # (.github-private dependabot-triage.yml -> claude-triage-executor):
          # it starts at the dependabot window (18:00 Prague) and merges/fixes
          # PRs with judgment. This job only delays the train while that agent
          # may still be working, so this week's bumps ride this week's release.
          # PRs still open after the wait were deliberately left by triage
          # (breaking/suspicious) - the train departs without them.
          for i in $(seq 1 45); do
            OPEN=$(gh pr list -R "$REPO" --author "app/dependabot" --state open --json number --jq 'length')
            [ "$OPEN" = "0" ] && { echo "No open dependabot PRs - proceeding."; exit 0; }
            echo "poll $i: $OPEN open dependabot PR(s), waiting for triage..."
            sleep 60
          done
          echo "Dependabot PR(s) still open after wait - triage left them; releasing without them." | tee -a "$GITHUB_STEP_SUMMARY"

  prepare-release:
    name: 🚝 Prepare release PR
    needs: [prague-gate, dependabot-quiescence]
    if: needs.prague-gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for an existing open release PR
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("release/"))] | .[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Open release PR #$EXISTING already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No open release PR."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect releasable commits + bump type
        id: detect
        if: steps.check_pr.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Highest semver tag, NOT `git describe`: historical tags were made on
          # side branches and are not ancestors of master, which makes describe
          # return a stale tag.
          LAST_TAG=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            RANGE=""
            echo "No tag found, considering full history."
          else
            RANGE="${LAST_TAG}..HEAD"
            echo "Last tag: $LAST_TAG"
          fi

          SUBJECTS=$(git log $RANGE --no-merges --pretty=%s)
          BODIES=$(git log $RANGE --no-merges --pretty=%B)

          # Releasable = any commit whose type is NOT docs/chore/ci, PLUS dependency
          # bumps (chore(deps*): dependabot merges ship in the bundle, so they release
          # as a patch). chore(release) stays excluded. Bare-version subjects (legacy
          # manual release commits like `0.2.0 (#28)`) do not count.
          if [ -n "$SUBJECTS" ]; then
            NON_CHORE=$(printf '%s\n' "$SUBJECTS" \
              | grep -vE '^(docs|chore|ci)(\([^)]*\))?!?:' \
              | grep -vcE '^[0-9]+\.[0-9]+\.[0-9]+' || true)
            DEPS=$(printf '%s\n' "$SUBJECTS" | grep -cE '^chore\(deps' || true)
            RELEASABLE=$((NON_CHORE + DEPS))
          else
            RELEASABLE=0
          fi

          if [ "$RELEASABLE" -eq 0 ]; then
            echo "No releasable commits since ${LAST_TAG:-repo start} (only docs/ci/non-deps chore). Nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Found $RELEASABLE releasable commit(s)."

          INPUT_BUMP="${{ github.event.inputs.bump_type }}"
          BUMP="${INPUT_BUMP:-auto}"
          if [ "$BUMP" = "auto" ]; then
            if printf '%s\n' "$SUBJECTS" | grep -qE '^[a-z]+(\([^)]*\))?!:' \
              || printf '%s\n' "$BODIES" | grep -qE 'BREAKING[ -]CHANGE'; then
              BUMP=major
            elif printf '%s\n' "$SUBJECTS" | grep -qE '^feat(\([^)]*\))?:'; then
              BUMP=minor
            else
              BUMP=patch
            fi
          fi
          echo "Bump type: $BUMP"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"

      - name: Verify (type-check + lint + format + test + build)
        if: steps.check_pr.outputs.skip != 'true' && steps.detect.outputs.release == 'true'
        run: npm run verify

      - name: Bump version (no tag)
        id: bump
        if: steps.check_pr.outputs.skip != 'true' && steps.detect.outputs.release == 'true'
        run: |
          set -euo pipefail
          # --no-git-tag-version: skip commit + tag; the `version` script still runs
          # version-bump.mjs (updates manifest.json + versions.json).
          npm version --no-git-tag-version "${{ steps.detect.outputs.bump }}"
          npm install --package-lock-only
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate release notes with Claude
        if: steps.check_pr.outputs.skip != 'true' && steps.detect.outputs.release == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Claude-written notes; the script hard-falls-back to a mechanical
          # conventional-commit grouping if the key is missing or the API fails.
          node scripts/generate-changelog.mjs "${{ steps.bump.outputs.version }}" > release-notes.md
          echo "Generated release notes:"
          cat release-notes.md

      - name: Update CHANGELOG.md
        if: steps.check_pr.outputs.skip != 'true' && steps.detect.outputs.release == 'true'
        run: node scripts/update-changelog.mjs "${{ steps.bump.outputs.version }}" < release-notes.md

      - name: Create release branch + PR
        id: pr
        if: steps.check_pr.outputs.skip != 'true' && steps.detect.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          BRANCH="release/${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Re-auth so the push is authored by the PAT when present, which lets
          # pr-validation fire on the release PR (GITHUB_TOKEN pushes are suppressed
          # to prevent recursion). Falls back to GITHUB_TOKEN.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          NOTES=$(cat release-notes.md)
          rm -f release-notes.md

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(release): ${VERSION}"
          git push origin "$BRANCH"

          cat > pr-body.md <<EOF
          ## Release ${VERSION}

          This PR prepares the release of version ${VERSION}.

          ### Changes
          ${NOTES}

          ---

          Scheduled runs merge this PR automatically (in-workflow verify already passed),
          then tag \`${VERSION}\` and dispatch the release workflow, which publishes the
          GitHub release the Obsidian community store installs from. If this PR is still
          open, the automated merge did not happen - merge it manually and
          auto-tag-on-merge.yml will finish the job.
          EOF

          PR_URL=$(gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "chore(release): ${VERSION}" \
            --body-file pr-body.md)
          rm -f pr-body.md
          echo "Opened $PR_URL"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

          gh label create release --color 0E8A16 --description "Automated release PR" 2>/dev/null || true
          gh pr edit "$PR_URL" --add-label "release" 2>/dev/null || true

      - name: Auto-merge release PR
        id: merge
        if: steps.pr.outputs.pr_url && (github.event_name == 'schedule' || github.event.inputs.auto_merge == 'true')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          # `--auto` waits for required checks; if the PR is already in a clean status
          # (no required checks) GitHub rejects it, so fall back to a direct squash.
          if ! OUT=$(gh pr merge "$PR_URL" --auto --squash 2>&1); then
            echo "$OUT"
            if echo "$OUT" | grep -q "clean status"; then
              gh pr merge "$PR_URL" --squash
            else
              exit 1
            fi
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Tag + dispatch release
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          set -euo pipefail
          # A GITHUB_TOKEN merge never fires auto-tag-on-merge.yml, so finish the
          # chain here. Skips cleanly if a tag already appeared (PAT-merge race).
          VERSION="${{ steps.bump.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists - auto-tag handled it."
            exit 0
          fi
          MERGE_SHA=""
          for i in $(seq 1 10); do
            MERGE_SHA=$(gh pr view "$PR_URL" --json mergeCommit --jq '.mergeCommit.oid // empty')
            [ -n "$MERGE_SHA" ] && break
            sleep 5
          done
          [ -n "$MERGE_SHA" ] || { echo "::error::merge commit not found for $PR_URL"; exit 1; }
          git fetch origin master
          git tag "${VERSION}" "${MERGE_SHA}"
          git push origin "${VERSION}" || echo "tag push raced auto-tag - fine"
          gh workflow run release.yml --ref master --repo "${{ github.repository }}"
          echo "Tagged ${VERSION} at ${MERGE_SHA} and dispatched release.yml." >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.check_pr.outputs.skip }}" = "true" ]; then
            echo "## Skipped - open release PR already exists" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.detect.outputs.release }}" != "true" ]; then
            echo "## Skipped - no releasable commits since the last tag" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ steps.pr.outputs.pr_url }}" ]; then
            echo "## Release PR opened" >> "$GITHUB_STEP_SUMMARY"
            echo "Version: ${{ steps.bump.outputs.version }} (bump: ${{ steps.detect.outputs.bump }})" >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.pr.outputs.pr_url }}" >> "$GITHUB_STEP_SUMMARY"
          fi
